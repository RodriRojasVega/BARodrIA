<div class="space-y-8 animate-fade-in">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
            <h2 class="text-3xl font-bold tracking-tight text-white">Catálogos Maestros</h2>
            <p class="text-gray-400 mt-1">Gestión de tablas maestras del sistema (Categorías, Familias, Soportes, Hielos, Técnicas).</p>
        </div>
        <div>
            <button id="btn-nuevo-catalogo" class="bg-emerald-500 hover:bg-emerald-600 text-gray-950 font-bold px-4 py-2 rounded-lg text-sm transition uppercase tracking-wider">
                + Nuevo Registro
            </button>
        </div>
    </div>

    <div class="bg-gray-900 border border-gray-800 p-4 rounded-xl flex items-center gap-4">
        <label class="text-gray-400 text-sm font-bold uppercase tracking-wider">Seleccionar Tabla:</label>
        <select id="selector-tabla-catalogo" class="bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 text-white text-sm focus:outline-none focus:border-emerald-500 font-mono">
            <option value="categorias">Categorías de Consumo</option>
            <option value="familias">Familias de Coctelería</option>
            <option value="soportes">Soportes y Vajilla</option>
            <option value="hielos">Tipos de Hielo</option>
            <option value="tecnicas">Técnicas de Barra</option>
        </select>
    </div>

    <div class="bg-gray-900 p-6 rounded-xl border border-gray-800 space-y-4">
        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm">
                <thead id="cabecera-catalogo" class="border-b border-gray-800 text-gray-400"></thead>
                <tbody id="tabla-catalogo" class="divide-y divide-gray-800"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="modal-catalogo" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center hidden">
    <div class="bg-gray-900 border border-gray-800 rounded-xl p-6 max-w-lg w-full mx-4 space-y-4">
        <div class="flex justify-between items-center border-b border-gray-800 pb-3">
            <h3 id="modal-catalogo-titulo" class="text-lg font-bold text-emerald-400">Gestión de Catálogo</h3>
            <button type="button" onclick="cerrarModalCatalogo()" class="text-gray-400 hover:text-white text-2xl font-bold leading-none">&times;</button>
        </div>
        <div id="catalogo-formulario-contenedor"></div>
    </div>
</div>
