<!-- ========================================== -->
<!-- VISTA DASHBOARD: ESTÁNDAR EDGE-TO-EDGE     -->
<!-- ========================================== -->
<div class="flex flex-col h-full w-full bg-gray-950 text-gray-100 overflow-y-auto custom-scrollbar font-sans pb-6">

    <!-- ========================================== -->
    <!-- HEADER EDGE-TO-EDGE CON STATUS SUPABASE    -->
    <!-- ========================================== -->
    <header class="flex items-center justify-between px-3 py-3 bg-gray-950 shrink-0 border-b border-gray-900 sticky top-0 z-10">
        <div class="flex items-center gap-2 min-w-0">
            <span class="text-lg sm:text-xl">📊</span>
            <h1 class="text-base sm:text-lg font-bold text-white tracking-wide truncate">Panel de Control Operativo</h1>
        </div>
        <div class="flex items-center gap-2 bg-emerald-950/30 border border-emerald-900/40 px-2.5 py-1.5 rounded-lg shrink-0 shadow-sm">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
            <span class="text-[9px] font-mono text-emerald-400 font-bold uppercase tracking-wider hidden sm:inline">Supabase Conectado</span>
            <span class="text-[9px] font-mono text-emerald-400 font-bold uppercase tracking-wider sm:hidden">Online</span>
        </div>
    </header>

    <!-- ========================================== -->
    <!-- SECCIÓN 1: MÉTRICAS OPERATIVAS (KPIs Color)-->
    <!-- ========================================== -->
    <div class="px-3 pt-5 space-y-3">
        <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider font-mono px-1">Métricas Principales</h2>
        
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <!-- KPI Insumos (Azul) -->
            <div class="flex flex-col items-center justify-center p-5 rounded-xl border bg-sky-950/20 border-sky-900/50 transition-all hover:bg-sky-950/40">
                <span class="text-[10px] font-mono font-bold uppercase tracking-wider text-sky-400 text-center">Total Insumos</span>
                <span id="kpi-insumos" class="text-3xl sm:text-4xl font-bold text-sky-100 mt-2">0</span>
            </div>

            <!-- KPI Sub-recetas (Púrpura) -->
            <div class="flex flex-col items-center justify-center p-5 rounded-xl border bg-purple-950/20 border-purple-900/50 transition-all hover:bg-purple-950/40">
                <span class="text-[10px] font-mono font-bold uppercase tracking-wider text-purple-400 text-center">Sub-recetas</span>
                <span id="kpi-sub-recetas" class="text-3xl sm:text-4xl font-bold text-purple-100 mt-2">0</span>
            </div>

            <!-- KPI Cócteles (Esmeralda) -->
            <div class="flex flex-col items-center justify-center p-5 rounded-xl border bg-emerald-950/20 border-emerald-900/50 transition-all hover:bg-emerald-950/40">
                <span class="text-[10px] font-mono font-bold uppercase tracking-wider text-emerald-400 text-center">Total Cócteles</span>
                <span id="kpi-cocteles" class="text-3xl sm:text-4xl font-bold text-emerald-100 mt-2">0</span>
            </div>

            <!-- KPI Proveedores (Ámbar) -->
            <div class="flex flex-col items-center justify-center p-5 rounded-xl border bg-amber-950/20 border-amber-900/50 transition-all hover:bg-amber-950/40">
                <span class="text-[10px] font-mono font-bold uppercase tracking-wider text-amber-400 text-center">Proveedores</span>
                <span id="kpi-proveedores" class="text-3xl sm:text-4xl font-bold text-amber-100 mt-2">0</span>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- SECCIÓN 2: CATÁLOGOS MAESTROS (Neutrales)  -->
    <!-- ========================================== -->
    <div class="px-3 pt-6 space-y-3">
        <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider font-mono px-1">Tablas Maestras y Catálogos</h2>

        <!-- Usamos una grilla de alta densidad que se adapta desde móvil hasta pantallas grandes -->
        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-7 gap-3">
            
            <div class="flex flex-col items-center justify-center p-3.5 rounded-xl border bg-gray-800/30 border-gray-700/50 transition-all hover:bg-gray-800/50">
                <span class="text-[10px] font-mono font-bold uppercase tracking-wider text-gray-400 truncate max-w-full">Categorías</span>
                <span id="cat-categorias" class="text-xl font-bold text-white mt-1">0</span>
            </div>

            <div class="flex flex-col items-center justify-center p-3.5 rounded-xl border bg-gray-800/30 border-gray-700/50 transition-all hover:bg-gray-800/50">
                <span class="text-[10px] font-mono font-bold uppercase tracking-wider text-gray-400 truncate max-w-full">Familias</span>
                <span id="cat-familias" class="text-xl font-bold text-white mt-1">0</span>
            </div>

            <div class="flex flex-col items-center justify-center p-3.5 rounded-xl border bg-gray-800/30 border-gray-700/50 transition-all hover:bg-gray-800/50">
                <span class="text-[10px] font-mono font-bold uppercase tracking-wider text-gray-400 truncate max-w-full">Soportes</span>
                <span id="cat-soportes" class="text-xl font-bold text-white mt-1">0</span>
            </div>

            <div class="flex flex-col items-center justify-center p-3.5 rounded-xl border bg-gray-800/30 border-gray-700/50 transition-all hover:bg-gray-800/50">
                <span class="text-[10px] font-mono font-bold uppercase tracking-wider text-gray-400 truncate max-w-full">Hielos</span>
                <span id="cat-hielos" class="text-xl font-bold text-white mt-1">0</span>
            </div>

            <div class="flex flex-col items-center justify-center p-3.5 rounded-xl border bg-gray-800/30 border-gray-700/50 transition-all hover:bg-gray-800/50">
                <span class="text-[10px] font-mono font-bold uppercase tracking-wider text-gray-400 truncate max-w-full">Técnicas</span>
                <span id="cat-tecnicas" class="text-xl font-bold text-white mt-1">0</span>
            </div>

            <div class="flex flex-col items-center justify-center p-3.5 rounded-xl border bg-gray-800/30 border-gray-700/50 transition-all hover:bg-gray-800/50">
                <span class="text-[10px] font-mono font-bold uppercase tracking-wider text-gray-400 truncate max-w-full">T. Insumos</span>
                <span id="cat-tipos-insumos" class="text-xl font-bold text-white mt-1">0</span>
            </div>

            <div class="flex flex-col items-center justify-center p-3.5 rounded-xl border bg-gray-800/30 border-gray-700/50 transition-all hover:bg-gray-800/50 lg:col-span-1 col-span-2 sm:col-span-3">
                <span class="text-[10px] font-mono font-bold uppercase tracking-wider text-gray-400 truncate max-w-full">T. Sub-recetas</span>
                <span id="cat-tipos-sub-recetas" class="text-xl font-bold text-white mt-1">0</span>
            </div>

        </div>
    </div>

</div>
