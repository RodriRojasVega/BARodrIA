<div class="max-w-7xl mx-auto px-4 py-8 space-y-6">

    <div id="vista-listado" class="space-y-6">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-gray-900 border border-gray-800 p-6 rounded-2xl shadow-xl">
            <div>
                <span class="text-xs uppercase font-bold tracking-wider text-emerald-400 font-mono">Gestión de Sub-Recetas</span>
                <h1 class="text-2xl font-bold text-white tracking-wide">Sub-recetas Artesanales</h1>
                <p class="text-xs text-gray-400 mt-1">Gestión de preparaciones intermedias, costos de lote y escandallos de barra.</p>
            </div>
            <button type="button" onclick="window.prepararCreacionSubReceta()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold uppercase tracking-wider px-4 py-2.5 rounded-xl transition shadow-lg flex items-center gap-2">
                <span>+ Nueva Sub-receta</span>
            </button>
        </div>

        <div class="relative">
            <input type="text" id="buscador-subrecetas" oninput="window.filtrarSubRecetas()" placeholder="Buscar sub-receta por nombre..." class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition shadow-inner">
        </div>

        <div id="contenedor-tarjetas-subrecetas" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <div class="text-center py-12 text-emerald-500 font-mono animate-pulse col-span-full">Cargando catálogo...</div>
        </div>
    </div>


    <div id="vista-detalle" class="hidden space-y-6">
        <div class="flex items-center justify-between border-b border-gray-800 pb-4">
            <button type="button" onclick="window.cambiarVistaSubRecetas('listado')" class="text-xs text-emerald-400 hover:text-emerald-300 font-bold uppercase tracking-wider flex items-center gap-2 transition bg-gray-900 border border-gray-800 px-3 py-2 rounded-xl">
                <span>← Volver al listado</span>
            </button>
            <div id="detalle-acciones-superiores" class="flex gap-2"></div>
        </div>

        <div id="panel-detalle-contenido" class="space-y-6"></div>
    </div>


    <div id="vista-formulario" class="hidden space-y-6 bg-gray-900 border border-gray-800 rounded-2xl p-6 sm:p-8 shadow-xl">
        <div class="flex items-center justify-between border-b border-gray-800 pb-4">
            <h2 id="form-titulo-seccion" class="text-xl font-bold text-white tracking-wide">Nueva Sub-receta</h2>
            <button type="button" onclick="window.cambiarVistaSubRecetas('listado')" class="text-xs text-gray-400 hover:text-white font-semibold uppercase transition">Cancelar</button>
        </div>

        <form id="form-subreceta-completo" onsubmit="window.guardarSubRecetaCompleta(event)" class="space-y-6">
            <input type="hidden" id="input-subreceta-id">

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="space-y-1.5 md:col-span-2">
                    <label class="text-xs font-bold text-gray-300 uppercase tracking-wider">Nombre de la Sub-receta</label>
                    <input type="text" id="input-nombre" required placeholder="Ej: Clarificado de Chocolate Blanco" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition shadow-inner">
                </div>
                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-gray-300 uppercase tracking-wider">Tipo de Preparación</label>
                    <select id="input-tipo-id" required class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition">
                        <option value="" class="bg-gray-900 text-gray-400">Seleccione tipo...</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-gray-300 uppercase tracking-wider">Rendimiento Batch</label>
                    <input type="number" step="0.01" id="input-rendimiento" required placeholder="1000" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition shadow-inner">
                </div>
                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-gray-300 uppercase tracking-wider">Unidad de Medida</label>
                    <select id="input-unidad" required class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition">
                        <option value="ml" class="bg-gray-900 text-white">ml</option>
                        <option value="g" class="bg-gray-900 text-white">g</option>
                        <option value="unit" class="bg-gray-900 text-white">unit</option>
                    </select>
                </div>
                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-gray-300 uppercase tracking-wider">Insumo Espejo Asociado</label>
                    <select id="input-insumo-asociado" required class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition">
                        <option value="" class="bg-gray-900 text-gray-400">Seleccione insumo en inventario...</option>
                    </select>
                </div>
            </div>

            <div class="space-y-3 pt-4 border-t border-gray-800">
                <div class="flex justify-between items-center">
                    <h3 class="text-xs font-bold text-emerald-400 uppercase tracking-wider">Composición (Ingredientes BOM)</h3>
                    <button type="button" onclick="window.agregarFilaIngrediente()" class="text-xs bg-gray-800 hover:bg-gray-750 text-emerald-400 px-3 py-1.5 rounded-lg border border-emerald-500/20 font-semibold transition">+ Agregar Insumo</button>
                </div>
                <div id="contenedor-filas-ingredientes" class="space-y-2"></div>
            </div>

            <div class="space-y-3 pt-4 border-t border-gray-800">
                <div class="flex justify-between items-center">
                    <h3 class="text-xs font-bold text-purple-400 uppercase tracking-wider">Pasos de Preparación</h3>
                    <button type="button" onclick="window.agregarFilaPaso()" class="text-xs bg-gray-800 hover:bg-gray-750 text-purple-400 px-3 py-1.5 rounded-lg border border-purple-500/20 font-semibold transition">+ Agregar Paso</button>
                </div>
                <div id="contenedor-filas-pasos" class="space-y-2"></div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 pt-4 border-t border-gray-800">
                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-gray-300 uppercase tracking-wider">Almacenamiento</label>
                    <textarea id="input-almacenamiento" rows="2" placeholder="Ej: Refrigerar en botella hermética" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition shadow-inner"></textarea>
                </div>
                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-gray-300 uppercase tracking-wider">Vida Útil</label>
                    <input type="text" id="input-vidautil" placeholder="Ej: 5 a 7 días" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition shadow-inner">
                </div>
                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-gray-300 uppercase tracking-wider">Economía Circular / Mermas</label>
                    <textarea id="input-mermas" rows="2" placeholder="Ej: Compostar sólidos restantes" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition shadow-inner"></textarea>
                </div>
            </div>

            <div class="flex justify-end gap-3 pt-6 border-t border-gray-800">
                <button type="button" onclick="window.cambiarVistaSubRecetas('listado')" class="bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs font-bold uppercase px-5 py-3 rounded-xl transition">Cancelar</button>
                <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold uppercase tracking-wider px-6 py-3 rounded-xl transition shadow-lg">Guardar Sub-receta</button>
            </div>
        </form>
    </div>

</div>
