<div class="space-y-8 animate-fade-in">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
            <h2 class="text-3xl font-bold tracking-tight text-white">Catálogos Maestros</h2>
            <p class="text-gray-400 mt-1">Diccionarios relacionales en Supabase. Crea, edita o elimina elementos en tiempo real.</p>
        </div>
        <div class="flex items-center gap-3">
            <select id="selector-tabla-catalogo" onchange="cambiarTablaCatalogo(this.value)" class="bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 text-sm text-white focus:outline-none">
                <option value="categorias">Categorías</option>
                <option value="familias">Familias de Cócteles</option>
                <option value="soportes">Soportes (Cristalería)</option>
                <option value="hielos">Hielos</option>
                <option value="tecnicas">Técnicas de Barra</option>
            </select>
            <button onclick="abrirModalCatalogo(null)" class="bg-emerald-500 hover:bg-emerald-600 text-gray-950 font-bold px-4 py-2 rounded-lg text-sm transition uppercase tracking-wider flex items-center gap-2">
                <span>+</span> Nuevo Elemento
            </button>
        </div>
    </div>

    <div class="bg-gray-900 border border-gray-800 rounded-xl p-6">
        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm">
                <thead id="cabecera-catalogo" class="text-gray-400 border-b border-gray-800">
                    </thead>
                <tbody id="tabla-catalogo" class="divide-y divide-gray-800">
                    <tr>
                        <td class="text-center py-8 text-gray-500">Selecciona un catálogo para cargar datos...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div id="modal-catalogo" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center hidden">
    <div class="bg-gray-900 border border-gray-800 rounded-xl p-6 max-w-md w-full mx-4 space-y-4">
        <div class="flex justify-between items-center border-b border-gray-800 pb-3">
            <h3 id="modal-titulo" class="text-lg font-bold text-emerald-400">Agregar Elemento</h3>
            <button onclick="cerrarModalCatalogo()" class="text-gray-400 hover:text-white text-xl font-bold">&times;</button>
        </div>
        <form id="form-catalogo" onsubmit="guardarElementoCatalogo(event)" class="space-y-4 text-sm">
            <input type="hidden" id="catalogo-item-id">
            <div id="campos-dinamicos-modal" class="space-y-4"></div>
            
            <div class="flex gap-3 pt-4 border-t border-gray-800">
                <button type="button" onclick="cerrarModalCatalogo()" class="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-300 py-2.5 rounded-lg font-bold transition">Cancelar</button>
                <button type="submit" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-gray-950 py-2.5 rounded-lg font-bold transition uppercase tracking-wider">Guardar</button>
            </div>
        </form>
    </div>
</div>
